name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Laravel tests and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      DB_CONNECTION: sqlite
      # Use the same database for migrations and PHPUnit.
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, dom, fileinfo, gd, mbstring, pdo_sqlite, sqlite3, xml, xmlreader, xmlwriter, zip
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate Composer files
        run: composer validate --strict --no-check-publish

      - name: Check PHP syntax
        run: |
          php -l artisan
          find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend dependencies
        # There is no package-lock.json yet, so npm ci cannot be used.
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          touch "$DB_DATABASE"
          php artisan key:generate --no-interaction
          php artisan migrate --force --no-interaction

      - name: Run tests
        run: composer test
